<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1456d9">
  <meta name="description" content="Organize household medicine batches and keep expiry dates in view.">
  <title>Dawa Saathi — Medicine tracker</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-action="home"><span class="brand-mark">＋</span><span>Dawa Saathi</span></a>
    <div class="top-actions"><span class="storage-label">Saved in this browser</span><button class="button button-primary" id="new-batch" type="button">＋ <span>New batch</span></button></div>
  </header>
  <main id="app" class="page" aria-live="polite"><div class="loading">Loading Dawa Saathi…</div></main>
  <dialog id="editor" class="dialog"><form id="editor-form" method="dialog"></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
